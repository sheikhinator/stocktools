name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (synthetic data only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.1.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build app folder (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/stockcompass.spec
      - name: Self-test the built app (open database, import, draw every page)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\StockCompass\StockCompass.exe -ArgumentList "--selftest","$PWD\selftest.log" -PassThru -Wait
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed with exit code $($p.ExitCode)"; exit 1 }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\StockCompass\* -DestinationPath "dist\StockCompass-Portable-${{ steps.v.outputs.version }}.zip"
      - name: Installer (Inno Setup, per-user)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: StockCompass-${{ steps.v.outputs.version }}
          path: |
            dist/StockCompass-Setup-*.exe
            dist/StockCompass-Portable-*.zip
          retention-days: 30
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock Compass ${{ steps.v.outputs.version }}
          body: |
            **Install:** download `StockCompass-Setup-${{ steps.v.outputs.version }}.exe` below and run it. No administrator
            rights needed; it installs for your user only and keeps your data when you update.
            **No installer?** Download `StockCompass-Portable-${{ steps.v.outputs.version }}.zip`, unzip anywhere, run `StockCompass.exe`.
            If Windows says "Windows protected your PC": click **More info → Run anyway** (the app is not code-signed yet).
            Your reports and database stay on your PC in `%LOCALAPPDATA%\StockCompass`.
          generate_release_notes: true
          files: |
            dist/StockCompass-Setup-*.exe
            dist/StockCompass-Portable-*.zip
