[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockcompass"
version = "0.5.0"
description = "Stock Compass: stock health and commercial performance for MAF Carrefour Pakistan"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "duckdb>=1.0",
  "python-calamine>=0.2",
  "xlsxwriter>=3.1",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[project.scripts]
stockcompass = "stockcompass.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
